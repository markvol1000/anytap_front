customHeaders:
  - pattern: '**/*'
    headers:
      - key: Permissions-Policy
        value: 'camera=(self), microphone=()'
  - pattern: '/robots.txt'
    headers:
      - key: Cache-Control
        value: 'public, max-age=3600'
  - pattern: '/sitemap.xml'
    headers:
      - key: Cache-Control
        value: 'public, max-age=3600'
