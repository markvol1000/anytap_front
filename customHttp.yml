customHeaders:
  - pattern: '**/*'
    headers:
      - key: Permissions-Policy
        value: 'camera=(self), microphone=()'
  - pattern: '/robots.txt'
    headers:
      - key: Cache-Control
        value: 'public, max-age=3600'
  - pattern: '/sitemap.xml'
    headers:
      - key: Cache-Control
        value: 'public, max-age=3600'
      - key: Content-Type
        value: 'application/xml; charset=utf-8'
  - pattern: '**/*.js'
    headers:
      - key: Cache-Control
        value: 'public, max-age=31536000, immutable'
  - pattern: '**/*.css'
    headers:
      - key: Cache-Control
        value: 'public, max-age=31536000, immutable'
  - pattern: '**/*.woff2'
    headers:
      - key: Cache-Control
        value: 'public, max-age=31536000, immutable'
